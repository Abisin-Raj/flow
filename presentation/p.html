            } else if (slideData.type === 'diagram') {
                const diagramContent = slideData.image ? `
                    <img src="${slideData.image}" class="max-w-full max-h-[78vh] object-contain relative z-20" style="filter: invert(1) brightness(1.2); opacity: 0.9;">
                ` : `
                    <div class="text-gray-500 mono text-sm relative z-20 flex flex-col items-center">
                        <span class="material-symbols-outlined text-6xl mb-4">architecture</span>
                        <span class="uppercase tracking-widest border border-gray-600 px-4 py-2 bg-black">Visual Structure Placeholder</span>
                    </div>
                `;

                return `
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10 pointer-events-none"></div>
                        <div class="z-10 w-full max-w-[95%] flex flex-col">
                            <div class="flex justify-between items-end border-b border-white pb-2 mb-4 slide-header">
                                <h2 class="text-5xl font-bold uppercase tracking-tight">${slideData.title}</h2>
                            </div>
                            <div class="diagram-box flex-grow w-full relative flex items-center justify-center p-4 bg-black bg-opacity-50 diagram-area">
                            <!-- Architectural grid lines -->
                                <div class="absolute inset-0" style="background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px); background-size: 50px 50px; opacity: 0.3;"></div>

                                <!-- Center Crosshair -->
                                <div class="absolute w-full h-px bg-white opacity-20"></div>
                                <div class="absolute h-full w-px bg-white opacity-20"></div>

                                ${diagramContent}

                                <!-- Decorative Corners -->
                                <div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-white"></div>
                                <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-white"></div>
                                <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-white"></div>
                                <div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-white"></div>
                            </div>
                        </div>
                `;
            }
        }

        function init() {
            renderSlide(currentSlide);
            // Listen for KDE Connect / Presentation Remote keys
            document.addEventListener('keydown', (e) => {
                // Next Slide: Right Arrow (39), Down Arrow, or Spacebar (32)
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.keyCode === 39 || e.keyCode === 32) {
                    console.log('Next slide triggered (Keyboard)');
                    if (e.key === ' ') e.preventDefault(); // Prevent page scroll
                    nextSlide();
                }
                // Previous Slide: Left Arrow (37) or Up Arrow
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.keyCode === 37) {
                    console.log('Previous slide triggered (Keyboard)');
                    prevSlide();
                }
            });

            // Mouse Click Navigation
            // Disable context menu to allow Right Click navigation
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            document.addEventListener('mousedown', (e) => {
                if (e.button === 2) { // Right Click
                    console.log('Next slide triggered (Mouse Right Click)');
                    nextSlide();
                } else if (e.button === 0) { // Left Click
                    console.log('Previous slide triggered (Mouse Left Click)');
                    prevSlide();
                } else if (e.button === 1) { // Middle Click
                    console.log('Fullscreen toggle triggered (Mouse Middle Click)');
                    toggleFullscreen();
                }
            });
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function updateProgress() {
            const progress = ((currentSlide + 1) / slides.length);
            anime({
                targets: '#progress-bar',
                scaleX: progress,
                easing: 'easeOutExpo',
                duration: 800
            });
            counter.innerText = `${(currentSlide + 1).toString().padStart(2, '0')} / ${slides.length}`;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide(currentSlide, 'next');
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide(currentSlide, 'prev');
            }
        }

        function renderSlide(index, direction = 'next') {
            updateProgress();

            // Clear existing
            root.innerHTML = '';

            const slideData = slides[index];
            const slideEl = document.createElement('div');
            // Basic container style for presentation mode
            slideEl.className = 'w-full h-full flex flex-col items-center justify-center p-12 active-slide absolute inset-0 bg-black';

            slideEl.innerHTML = getSlideHTML(slideData);

            // Initial states for animation
            if (slideData.type === 'diagram') {
                // Diagram area starts hidden/scaled for animation
                const area = slideEl.querySelector('.diagram-area');
                if (area) { area.style.opacity = '0'; area.style.transform = 'scale(0.95)'; }
            }

            root.appendChild(slideEl);

            // ANIMATION SEQUENCE

            // 1. Slide Entrance (Mask Reveal effect)
            anime({
                targets: slideEl,
                clipPath: direction === 'next'
                    ? ['polygon(100% 0, 100% 0, 100% 100%, 100% 100%)', 'polygon(0 0, 100% 0, 100% 100%, 0 100%)']
                    : ['polygon(0 0, 0 0, 0 100%, 0 100%)', 'polygon(0 0, 100% 0, 100% 100%, 0 100%)'],
                easing: 'cubicBezier(0.25, 1, 0.5, 1)',
                duration: 800
            });

            // 2. Content Animations
            if (slideData.type === 'title') {
                anime.timeline()
                    .add({
                        targets: '.slide-title',
                        translateY: [100, 0],
                        opacity: [0, 1],
                        easing: 'easeOutExpo',
                        duration: 1200,
                        delay: 300
                    })
                    .add({
                        targets: '.slide-line',
                        width: [0, '8rem'],
                        easing: 'easeOutExpo',
                        duration: 800
                    }, '-=800')
                    .add({
                        targets: '.slide-subtitle',
                        translateY: [20, 0],
                        opacity: [0, 1],
                        easing: 'easeOutExpo',
                        duration: 800
                    }, '-=600');
            }
            else if (slideData.type === 'content') {
                anime.timeline()
                    .add({
                        targets: '.slide-header',
                        translateX: [-50, 0],
                        opacity: [0, 1],
                        easing: 'easeOutExpo',
                        duration: 1000,
                        delay: 300
                    })
                    .add({
                        targets: '.bullet-point',
                        translateX: [-20, 0],
                        opacity: [0, 1],
                        delay: anime.stagger(150),
                        easing: 'easeOutQuad',
                        duration: 800
                    }, '-=600');
            }
            else if (slideData.type === 'diagram') {
                anime.timeline()
                    .add({
                        targets: '.slide-header',
                        translateY: [-20, 0],
                        opacity: [0, 1],
                        easing: 'easeOutExpo',
                        duration: 800,
                        delay: 200
                    })
                    .add({
                        targets: '.diagram-area',
                        opacity: [0, 1],
                        scale: [0.95, 1],
                        easing: 'easeOutExpo',
                        duration: 1200
                    }, '-=400');
            }
        }

        // --- DOWNLOAD & PRINT FEATURES ---

        // Function 1: Download the HTML file locally
        function downloadHTML() {
            // Get the current document HTML
            const htmlContent = document.documentElement.outerHTML;

            // Create a blob
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            // Create hidden link and click it
            const a = document.createElement('a');
            a.href = url;
            a.download = 'flow_presentation.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Clean up
            URL.revokeObjectURL(url);
        }

        // Function 2: Enable Print Mode (Vertically stack all slides for "Save as PDF")
        function enablePrintMode() {
            const root = document.getElementById('app-root');

            // Stop animations or interactivity
            root.innerHTML = '';

            // Change body/root to scrollable for print view
            document.body.style.overflow = 'auto';
            root.style.height = 'auto';
            root.style.overflow = 'visible';

            // Hide UI controls
            controlsUI.style.display = 'none';
            document.getElementById('progress-bar').style.display = 'none';

            // Render ALL slides statically
            slides.forEach((slideData, index) => {
                const wrapper = document.createElement('div');
                // Use a class that handles page breaks in print
                wrapper.className = 'slide-container-print w-full h-screen flex flex-col items-center justify-center p-12 bg-black relative border-b border-gray-800';
                wrapper.innerHTML = getSlideHTML(slideData);

                // Ensure elements are visible (override animation initial states)
                const bullets = wrapper.querySelectorAll('.bullet-point');
                bullets.forEach(b => { b.style.opacity = '1'; b.style.transform = 'none'; });

                const diagram = wrapper.querySelector('.diagram-area');
                if (diagram) { diagram.style.opacity = '1'; diagram.style.transform = 'none'; }

                root.appendChild(wrapper);
            });

            // Prompt user
            setTimeout(() => {
                window.print();
                alert("If you want to return to the interactive presentation, please refresh this page.");
            }, 500);
        }

        // Start App
        init();

    </script>
